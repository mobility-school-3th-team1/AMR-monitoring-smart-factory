# Docker profile: H2 in-memory (temporary until DB area merge provides MySQL).
server:
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  # 로컬 Docker 시연용 기본값(Base64, 32바이트). 운영·공유 환경에서는 JWT_SECRET 환경 변수로 반드시 교체.
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  demo:
    password: ${DEMO_USER_PASSWORD:}
    recovery-seconds: 20
    recovery-check-interval-ms: 3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
