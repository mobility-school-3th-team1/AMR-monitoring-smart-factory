# Docker profile: MySQL (SCADA_MySQL). 시연 통합 compose 기준.
server:
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:SCADA_MySQL}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:scadadb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${DB_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  # 로컬 Docker 시연용 기본값(Base64, 32바이트). 운영·공유 환경에서는 JWT_SECRET 환경 변수로 반드시 교체.
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  demo:
    password: ${DEMO_USER_PASSWORD:}
    recovery-seconds: 20
    recovery-check-interval-ms: 3000
    task-duration-seconds: 20
    task-assign-interval-ms: 8000
    charge-rate-pct-per-sec: 5
    idle-discharge-pct: 1
    idle-discharge-interval-sec: 5
    operating-discharge-pct: 1
    battery-full-pct: 100
    primary-charge-station-id: 1
    low-battery-charge-threshold-pct: 20
    critical-stop-battery-threshold-pct: 5
    charging-position-x-percent: 5
    charging-position-y-percent: 15
    charging-arrival-tolerance-percent: 1.0
    charge-approach-step-percent: 2.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
