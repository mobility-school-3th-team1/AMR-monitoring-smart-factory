server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: amr_control_system
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  demo:
    password: ${DEMO_USER_PASSWORD:}
    recovery-seconds: 20
    recovery-check-interval-ms: 3000
    task-duration-seconds: 20
    task-assign-interval-ms: 8000
    charge-rate-pct-per-sec: 5
    idle-discharge-pct: 1
    idle-discharge-interval-sec: 5
    operating-discharge-pct: 1
    battery-full-pct: 100
    primary-charge-station-id: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
