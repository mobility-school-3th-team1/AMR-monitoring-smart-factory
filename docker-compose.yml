version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: SCADA_MySQL_Temp
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-amr_monitoring}
      TZ: 'Asia/Seoul'
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DB/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - amr_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s

volumes:
  mysql_data:
    driver: local

networks:
  amr_network:
    driver: bridge
