# 통합 스택 (BE + DAS·DB + FE). 프로젝트 루트에서:
#   cp .env.example .env   # JWT_SECRET 미설정 시 compose 기본값 사용(로컬 시연용)
#   docker compose up --build
#
# 영역 단독 기동: BE/docker-compose.yml, docker/docker-compose.yml, FE/docker-compose.yml

services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: MQTT_Broker
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - amr-net
    restart: unless-stopped

  mysql:
    image: mysql:latest
    container_name: SCADA_MySQL
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - amr-net
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-scadadb}
      TZ: Asia/Seoul
    restart: unless-stopped

  nodered:
    build:
      context: ./docker/node-red
      dockerfile: Dockerfile
    image: amr-nodered:local
    container_name: Node-RED
    ports:
      - "${NODERED_PORT:-1880}:1880"
    volumes:
      - ./docker/node-red:/data
    networks:
      - amr-net
    environment:
      FLOWS: flows.json
    healthcheck:
      test: ["CMD-SHELL", "node /healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mqtt:
        condition: service_started
      mysql:
        condition: service_started
    restart: unless-stopped

  be:
    build:
      context: ./BE/amr_control_system
      dockerfile: Dockerfile
    container_name: amr-be
    ports:
      - "${BE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - amr-net
    restart: unless-stopped

  fe:
    build:
      context: ./FE/frontend
      dockerfile: Dockerfile
      args:
        VITE_MQTT_URL: ${VITE_MQTT_URL:-ws://localhost:9001}
    container_name: amr-fe
    ports:
      - "${FE_HOST_PORT:-3000}:80"
    depends_on:
      be:
        condition: service_healthy
    networks:
      - amr-net
    restart: unless-stopped

networks:
  amr-net:
    driver: bridge
